name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every `run:` step executes inside `nix develop`, so tools (go, golangci-lint)
# come straight from the flake devShell with no per-step prefix.
defaults:
  run:
    shell: nix develop --accept-flake-config --command bash -e {0}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Nix
        uses: NixOS/nix-installer-action@6b8548fe06acfb0155a50ab5d561accb215764cc # main

      - name: Setup Nix cache (hestia)
        uses: Mic92/hestia/action@ff07bb902a9968ac0c3d0e51d90a606662a375d8 # main

      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Nix
        uses: NixOS/nix-installer-action@6b8548fe06acfb0155a50ab5d561accb215764cc # main

      - name: Setup Nix cache (hestia)
        uses: Mic92/hestia/action@ff07bb902a9968ac0c3d0e51d90a606662a375d8 # main

      - name: go vet
        run: go vet ./...

      - name: go test (race + cover)
        run: go test -race -cover ./...

      - name: go fuzz (short)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -d score ]; then
            go test -run=NONE -fuzz=. -fuzztime=30s ./score || true
          fi

  nix:
    name: nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Nix
        uses: NixOS/nix-installer-action@6b8548fe06acfb0155a50ab5d561accb215764cc # main

      - name: Setup Nix cache (hestia)
        uses: Mic92/hestia/action@ff07bb902a9968ac0c3d0e51d90a606662a375d8 # main

      - name: nix flake check
        run: nix flake check --accept-flake-config

      - name: nix build
        run: nix build .#default --accept-flake-config
