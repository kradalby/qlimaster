name: release

# Continuous release: every push to main builds binaries and publishes them
# to a single rolling "continuous" prerelease. No version tags are cut.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

# Every `run:` step executes inside `nix develop`, so goreleaser (and the Go
# toolchain) come straight from the flake devShell with no per-step prefix.
defaults:
  run:
    shell: nix develop --accept-flake-config --command bash -e {0}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Setup Nix cache (hestia)
        uses: Mic92/hestia/action@main

      - name: Build binaries
        run: goreleaser release --clean --snapshot

      - name: Publish rolling release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: continuous
          name: Continuous build
          prerelease: true
          # Point the continuous tag at the commit being released.
          target_commitish: ${{ github.sha }}
          body: "Rolling build from ${{ github.sha }}. Not a stable release."
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
