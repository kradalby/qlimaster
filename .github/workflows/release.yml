name: release

# Continuous release: every push to main builds binaries and publishes them
# to a single rolling "continuous" prerelease. No version tags are cut.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

# Every `run:` step executes inside `nix develop`, so goreleaser (and the Go
# toolchain) come straight from the flake devShell with no per-step prefix.
defaults:
  run:
    shell: nix develop --accept-flake-config --command bash -e {0}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: NixOS/nix-installer-action@6b8548fe06acfb0155a50ab5d561accb215764cc # main

      - name: Setup Nix cache (hestia)
        uses: Mic92/hestia@7ae4509d1c3cacd4a31b91d9ad308d74e0b5a053 # v1.0.2

      - name: Build binaries
        run: goreleaser release --clean --snapshot

      - name: Publish rolling release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: continuous
          name: Continuous build
          prerelease: true
          # Point the continuous tag at the commit being released.
          target_commitish: ${{ github.sha }}
          body: "Rolling build from ${{ github.sha }}. Not a stable release."
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
