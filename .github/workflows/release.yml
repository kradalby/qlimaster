name: release

# Continuous release: every push to main builds binaries and publishes them
# to a single rolling "continuous" prerelease. No version tags are cut.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

# Every `run:` step executes inside `nix develop`, so goreleaser (and the Go
# toolchain) come straight from the flake devShell with no per-step prefix.
defaults:
  run:
    shell: nix develop --accept-flake-config --command bash -e {0}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0

      - name: Setup Nix cache (hestia)
        uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0

      - name: Build binaries
        run: goreleaser release --clean --snapshot

      - name: Publish rolling release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: continuous
          name: Continuous build
          prerelease: true
          # Point the continuous tag at the commit being released.
          target_commitish: ${{ github.sha }}
          body: "Rolling build from ${{ github.sha }}. Not a stable release."
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
